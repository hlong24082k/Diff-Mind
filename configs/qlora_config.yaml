# Source: PROJECT_PLAN.md Milestone 2. Change values per experiment; log the run in docs/experiments.md.
base_model: Qwen/Qwen2.5-Coder-3B-Instruct
dataset: <your-username>/pr-review-high-signal
max_seq_length: 2048

quant:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  fp16: true   # T4/P100 have no bf16
  bf16: false
  optim: paged_adamw_8bit
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  num_train_epochs: 3
  eval_steps: 25
  save_steps: 50
  push_to_hub: true
  seed: 42
